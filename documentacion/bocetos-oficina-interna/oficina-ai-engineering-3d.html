<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oficina AI Engineering</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: escena 3D a pantalla completa con HUD de vidrio encima (equipo a la izquierda, ficha a la derecha, bitácora abajo). */
:root{
  --bg:#e6ecf1;
  --ink:#0f172a;
  --ink2:#51607a;
  --glass:rgba(255,255,255,.74);
  --line:rgba(15,23,42,.10);
  --accent:#f26b21;
  --ok:#15a34a;
  --warn:#d98a06;
  --f-display:'Outfit',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-display);overflow:hidden}
#stage{position:absolute;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;display:flex;gap:6px;align-items:center;white-space:nowrap;font-size:12px;font-weight:600;padding:3px 9px 3px 7px;border-radius:99px;background:rgba(255,255,255,.92);box-shadow:0 2px 10px rgba(15,23,42,.18);transition:opacity .2s;will-change:transform}
.lbl i{width:8px;height:8px;border-radius:50%;display:block}
.lbl span{font-family:var(--f-mono);font-weight:400;color:var(--ink2);font-size:11px}
.lbl.sel{outline:2px solid var(--accent)}
.glass{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.7);box-shadow:0 8px 30px rgba(15,23,42,.12);border-radius:18px}
#top{position:absolute;top:14px;left:14px;right:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;pointer-events:none}
#top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;padding:8px 16px 8px 8px;border-radius:99px}
.logo{width:34px;height:34px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:#fff;font-weight:700;font-size:18px}
.brand b{font-size:15px;display:block;line-height:1.1}
.brand small{font-size:11px;color:var(--ink2)}
.stats{display:flex;gap:4px;padding:6px 8px}
.stat{padding:4px 14px;border-right:1px solid var(--line);min-width:96px}
.stat:last-child{border:0}
.stat small{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.stat b{font-family:var(--f-mono);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.clock{padding:10px 16px;font-family:var(--f-mono);font-size:14px;font-weight:500;display:flex;gap:8px;align-items:center;border-radius:99px}
.dot-live{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(21,163,74,.6);animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(21,163,74,0)}100%{box-shadow:0 0 0 0 rgba(21,163,74,0)}}
#team{position:absolute;left:14px;top:84px;width:272px;padding:12px;display:flex;flex-direction:column;gap:6px;max-height:calc(100% - 200px);overflow:auto}
#team h2,#detail h2{margin:2px 4px 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);font-weight:600}
.row{display:grid;grid-template-columns:12px 1fr auto;gap:2px 10px;align-items:center;padding:9px 10px;border-radius:12px;border:1px solid transparent;background:transparent;font:inherit;color:inherit;text-align:left;cursor:pointer;width:100%}
.row:hover{background:rgba(255,255,255,.7)}
.row:focus-visible,.btn:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row.sel{background:#fff;border-color:var(--line);box-shadow:0 2px 8px rgba(15,23,42,.08)}
.row .dot{width:12px;height:12px;border-radius:50%;grid-row:1/3}
.row .nm{font-weight:600;font-size:14px}
.row .rl{font-size:12px;color:var(--ink2);grid-column:2}
.row .st{font-size:11px;font-family:var(--f-mono);grid-column:3;grid-row:1/3;padding:3px 8px;border-radius:99px;background:rgba(21,163,74,.12);color:var(--ok)}
.row .st.pause{background:rgba(217,138,6,.14);color:var(--warn)}
.row .bar{grid-column:1/4;height:3px;border-radius:3px;background:rgba(15,23,42,.08);margin-top:6px;overflow:hidden}
.row .bar i{display:block;height:100%;width:0;background:var(--c,#999);transition:width .4s linear}
#detail{position:absolute;right:14px;top:84px;width:312px;padding:16px;display:flex;flex-direction:column;gap:12px;max-height:calc(100% - 200px);overflow:auto}
.d-head{display:flex;gap:12px;align-items:center}
.avatar{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:20px}
.d-head b{font-size:19px;display:block;line-height:1.1}
.d-head small{color:var(--ink2);font-size:13px}
.tag{display:inline-block;font-family:var(--f-mono);font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);background:#fff;margin-top:4px}
.task{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.task small{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.task p{margin:3px 0 8px;font-size:14px;font-weight:500;min-height:20px}
.pbar{height:6px;border-radius:6px;background:rgba(15,23,42,.08);overflow:hidden}
.pbar i{display:block;height:100%;width:0;border-radius:6px;transition:width .4s linear}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.kpi small{display:block;font-size:10.5px;color:var(--ink2);letter-spacing:.04em;text-transform:uppercase}
.kpi b{font-family:var(--f-mono);font-size:18px;font-variant-numeric:tabular-nums}
.spark small{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.spark svg{display:block;width:100%;height:64px;margin-top:4px}
.actions{display:flex;gap:8px}
.btn{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 14px;border-radius:99px;cursor:pointer}
.btn:hover{background:#f4f6f9}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.primary:hover{background:#1e293b}
#feed{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;width:min(460px,calc(100% - 28px));padding:10px 14px;font-size:13px}
#feed h2{margin:0 0 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);font-weight:600}
#feed ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
#feed li{display:grid;grid-template-columns:48px 8px 1fr;gap:8px;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#feed li time{font-family:var(--f-mono);font-size:11px;color:var(--ink2)}
#feed li i{width:8px;height:8px;border-radius:50%}
#feed li span{overflow:hidden;text-overflow:ellipsis}
#tools{position:absolute;right:14px;bottom:14px;display:flex;gap:8px}
#chips{display:none}
#hint{position:absolute;left:14px;bottom:14px;font-size:12px;color:var(--ink2);padding:8px 12px;border-radius:99px}
.hint-d{display:none}
@media (max-width:1180px){#stats-extra{display:none}}
@media (max-width:860px){
  #team,#hint{display:none}
  .stats .stat{min-width:0;padding:2px 10px}
  .stat:nth-child(n+3){display:none}
  .stat b{font-size:16px}
  .brand small,.clock{display:none}
  #feed{display:none}
  #detail{right:10px;left:10px;width:auto;top:auto;bottom:62px;max-height:46%;padding:12px;gap:8px}
  #detail .kpis{grid-template-columns:1fr 1fr 1fr}
  .spark{display:none}
  #tools{display:none}
  #chips{display:flex;position:absolute;left:0;right:0;bottom:10px;gap:8px;overflow-x:auto;padding:0 10px}
  .chip{flex:0 0 auto;display:flex;gap:8px;align-items:center;font:inherit;font-size:13px;font-weight:600;border:1px solid rgba(255,255,255,.8);background:var(--glass);backdrop-filter:blur(12px);color:var(--ink);padding:9px 14px;border-radius:99px;cursor:pointer}
  .chip i{width:10px;height:10px;border-radius:50%}
  .chip.sel{background:#fff;outline:2px solid var(--accent)}
}
@media (prefers-reduced-motion:reduce){.dot-live{animation:none}.pbar i,.row .bar i{transition:none}}
</style>
</head>
<body>
<div id="stage"></div>
<div id="labels"></div>

<div id="top">
  <div class="brand glass"><div class="logo">m</div><div><b>Oficina AI Engineering</b><small>Minus · datos simulados</small></div></div>
  <div class="stats glass" id="stats">
    <div class="stat"><small>Tareas hoy</small><b id="s-tasks">0</b></div>
    <div class="stat"><small>Activos</small><b id="s-active">0/6</b></div>
    <div class="stat"><small>Pruebas verdes</small><b id="s-tests">0%</b></div>
    <div class="stat"><small>Tokens</small><b id="s-tokens">0</b></div>
  </div>
  <div class="clock glass"><span class="dot-live"></span><span class="t">Medellín</span><span id="clock">--:--</span></div>
</div>

<aside id="team" class="glass"><h2>Equipo · AI Engineering</h2><div id="team-list"></div></aside>
<aside id="detail" class="glass" aria-live="polite"></aside>

<section id="feed" class="glass"><h2>Actividad</h2><ul id="feed-list"></ul></section>
<div id="tools">
  <button class="btn" id="b-rot" type="button">Girar cámara</button>
  <button class="btn primary" id="b-home" type="button">Vista general</button>
</div>
<div id="chips"></div>
<div id="hint" class="glass">Arrastra para girar · rueda para acercar · clic en un ingeniero</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
'use strict';
const REDUCE = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- Datos simulados de los ingenieros ---------- */
const AG = [
 {id:'nova',  name:'Nova',  role:'Ingeniera de pruebas', focus:'Jest',        color:'#16a34a', kind:'jest',
  tasks:['Corriendo suite de integración','Cubriendo el módulo de auth','Estabilizando un test intermitente','Subiendo cobertura de leads','Probando el webhook de pagos']},
 {id:'lumen', name:'Lumen', role:'Ingeniero de LLMs',    focus:'LLM',         color:'#7c3aed', kind:'llm',
  tasks:['Afinando el prompt de calificación','Comparando Claude vs Gemini','Reduciendo costo por conversación','Evaluando respuestas con rúbrica','Cacheando el prompt del sistema']},
 {id:'atlas', name:'Atlas', role:'Ingeniero de RAG',     focus:'RAG',         color:'#0891b2', kind:'rag',
  tasks:['Reindexando contratos','Ajustando tamaño de chunks','Midiendo recall@5','Añadiendo reranker','Limpiando PDFs de obra']},
 {id:'orbit', name:'Orbit', role:'Agentes y MCP',        focus:'MCP',         color:'#f26b21', kind:'mcp',
  tasks:['Conectando servidor MCP de Siesa','Orquestando agente de cotizaciones','Definiendo permisos de herramientas','Probando el flujo con SAP','Añadiendo reintentos al agente']},
 {id:'forge', name:'Forge', role:'Backend y APIs',       focus:'FastAPI',     color:'#e11d48', kind:'api',
  tasks:['Optimizando el endpoint /leads','Añadiendo colas de trabajo','Documentando la API','Migrando a async','Midiendo latencia p95']},
 {id:'delta', name:'Delta', role:'Datos y SQL',          focus:'SQL',         color:'#ca8a04', kind:'sql',
  tasks:['Indexando la tabla de proyectos','Escribiendo vista de ventas','Depurando duplicados de clientes','Optimizando consulta de inventario','Creando migración de esquema']}
];
const SQLQ = ['SELECT * FROM leads WHERE estado = \'nuevo\'','UPDATE proyectos SET avance = 0.82','CREATE INDEX idx_cliente ON ventas(cliente_id)','SELECT sum(valor) FROM obras GROUP BY mes'];
const MCPS = ['github','supabase','gmail','siesa'];
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
AG.forEach((a,i)=>{
  a.i=i;
  a.done=Math.floor(rnd(4,11));
  a.mins=Math.floor(rnd(80,260));
  a.week=Array.from({length:7},()=>Math.floor(rnd(5,16)));
  a.task=a.tasks[i%a.tasks.length]; a.progress=rnd(.1,.8);
  a.tokens=Math.floor(rnd(90e3,260e3));
  a.chunks=Math.floor(rnd(11000,14000));
  a.rate=rnd(.035,.06);
  a.hist=Array.from({length:60},()=>rnd(40,90));
  a.sqlPos=0; a.sqlI=0;
  a.cov=87.2; a.pass=97.4; a.calls=Math.floor(rnd(900,1400)); a.rows=Math.floor(rnd(2e5,4e5)); a.p95=Math.floor(rnd(70,120));
});

/* ---------- Escena ---------- */
const stage=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0xe6ecf1);
scene.fog=new THREE.Fog(0xe6ecf1,30,60);
const camera=new THREE.PerspectiveCamera(34,1,.1,100);
const HOME={p:new THREE.Vector3(11,9.6,13.5),t:new THREE.Vector3(0,.7,.2)};
camera.position.copy(HOME.p);
const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.target.copy(HOME.t); controls.enableDamping=true; controls.dampingFactor=.08;
controls.minDistance=3; controls.maxDistance=30; controls.maxPolarAngle=Math.PI*.47; controls.autoRotateSpeed=.8;
controls.enablePan=true;

scene.add(new THREE.HemisphereLight(0xffffff,0xb9c4d0,.95));
const sun=new THREE.DirectionalLight(0xffffff,.85);
sun.position.set(8,14,9); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-12,right:12,top:10,bottom:-10,near:1,far:40});
sun.shadow.bias=-.0004;
scene.add(sun);

const M=(c,o)=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.65,metalness:.05},o||{}));
function box(w,h,d,mat,x,y,z,parent){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x||0,y||0,z||0);m.castShadow=true;m.receiveShadow=true;(parent||scene).add(m);return m;}
function cyl(rt,rb,h,mat,x,y,z,parent,seg){const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg||24),mat);m.position.set(x||0,y||0,z||0);m.castShadow=true;m.receiveShadow=true;(parent||scene).add(m);return m;}
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function mkTex(c){const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=4;return t;}

/* Piso con tablones */
(function(){
  const c=mkCanvas(512,512),g=c.getContext('2d');
  for(let i=0;i<8;i++){const l=198+Math.random()*14;g.fillStyle='hsl(32,'+(38+Math.random()*6)+'%,'+(62+Math.random()*5)+'%)';g.fillRect(0,i*64,512,64);g.fillStyle='rgba(90,55,25,.35)';g.fillRect(0,i*64,512,2);
    const off=Math.random()*512;g.fillRect(off,i*64,2,64);}
  const t=mkTex(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(4,3);
  const side=M(0x3b4658),top=new THREE.MeshStandardMaterial({map:t,roughness:.8});
  const f=new THREE.Mesh(new THREE.BoxGeometry(16,.4,11),[side,side,top,side,side,side]);
  f.position.y=-.2;f.receiveShadow=true;scene.add(f);
})();
/* Paredes */
const wallM=M(0xf4f5f2,{roughness:.9});
box(16,5.2,.3,wallM,0,2.6,-5.65);
box(16,.18,.32,M(0xf26b21),0,.09,-5.64);
box(.3,5.2,11,wallM,-8.15,2.6,0);
/* Ventanas (pared izquierda) */
(function(){
  const c=mkCanvas(256,256),g=c.getContext('2d');
  const gr=g.createLinearGradient(0,0,0,256);gr.addColorStop(0,'#9fd0ff');gr.addColorStop(1,'#eaf6ff');g.fillStyle=gr;g.fillRect(0,0,256,256);
  g.fillStyle='rgba(255,255,255,.9)';g.beginPath();g.ellipse(70,170,50,18,0,0,7);g.ellipse(160,190,70,20,0,0,7);g.fill();
  const t=mkTex(c);
  [-3.4,0,3.4].forEach(z=>{
    const p=new THREE.Mesh(new THREE.PlaneGeometry(2.6,2.8),new THREE.MeshBasicMaterial({map:t}));p.position.set(-7.98,2.7,z);p.rotation.y=Math.PI/2;scene.add(p);
    box(.1,.1,2.8,M(0x334155),-7.96,2.7,z-1.35);box(.1,.1,2.8,M(0x334155),-7.96,2.7,z+1.35);
    box(.1,2.8,.06,M(0x334155),-7.96,2.7,z);
  });
})();

/* Pantalla grande de pared */
const wallC=mkCanvas(1536,480),wallX=wallC.getContext('2d'),wallT=mkTex(wallC);
box(8.4,2.8,.12,M(0x111827),0,3.05,-5.45);
const wallScreen=new THREE.Mesh(new THREE.PlaneGeometry(8.1,2.53),new THREE.MeshBasicMaterial({map:wallT}));
wallScreen.position.set(0,3.05,-5.38);scene.add(wallScreen);

/* ---------- Escritorios ---------- */
const DX=[-2.6,0,2.6], ROW=[-1.2,2.0];
const woodM=M(0xe9e4da,{roughness:.55}), legM=M(0x475569,{metalness:.4,roughness:.4});
const chairM=M(0x1f2937,{roughness:.8});
AG.forEach((a,i)=>{
  const dx=DX[i%3], dz=ROW[Math.floor(i/3)];
  a.desk={x:dx,z:dz};
  a.seat={x:dx-.45,z:dz-.78};
  a.gap={x:dx+1.3};
  box(1.9,.08,.95,woodM,dx,.78,dz);
  [[-.85,-.4],[.85,-.4],[-.85,.4],[.85,.4]].forEach(p=>box(.07,.76,.07,legM,dx+p[0],.38,dz+p[1]));
  box(.5,.03,.17,M(0x94a3b8),dx-.45,.835,dz+.0);           // teclado
  box(.18,.13,.1,M(a.color,{emissive:a.color,emissiveIntensity:.15}),dx+.05,.88,dz+.28);   // taza/objeto de color
  // silla
  cyl(.3,.3,.07,chairM,a.seat.x,.46,a.seat.z);
  cyl(.05,.05,.4,legM,a.seat.x,.24,a.seat.z);
  cyl(.28,.28,.04,legM,a.seat.x,.03,a.seat.z);
  box(.52,.55,.07,chairM,a.seat.x,.78,a.seat.z-.28);
  // monitor con pantalla propia
  const mon=new THREE.Group();mon.position.set(dx+.55,.82,dz+.05);mon.rotation.y=.3;scene.add(mon);
  box(.2,.3,.16,legM,0,.15,0,mon);
  box(1.0,.62,.06,M(0x111827),0,.62,0,mon);
  a.cv=mkCanvas(400,244);a.cx=a.cv.getContext('2d');a.tx=mkTex(a.cv);
  const sc=new THREE.Mesh(new THREE.PlaneGeometry(.92,.54),new THREE.MeshBasicMaterial({map:a.tx}));sc.position.set(0,.62,.032);mon.add(sc);
  sc.userData.agent=a.id;
  a.mon=mon;
  // botón de color en el borde del escritorio
  box(1.9,.03,.04,M(a.color,{emissive:a.color,emissiveIntensity:.35}),dx,.74,dz+.47);
});
/* Lámparas colgantes */
[-3.4,0,3.4].forEach(x=>[-1.2,2.0].forEach(z=>{
  cyl(.01,.01,2.2,M(0x64748b),x,4.0,z,null,6);
  const sh=new THREE.Mesh(new THREE.ConeGeometry(.55,.4,24,1,true),new THREE.MeshStandardMaterial({color:0xffffff,side:THREE.DoubleSide,roughness:.5}));sh.position.set(x,2.85,z);scene.add(sh);
  const bulb=new THREE.Mesh(new THREE.SphereGeometry(.12,12,12),new THREE.MeshBasicMaterial({color:0xfff3c4}));bulb.position.set(x,2.78,z);scene.add(bulb);
}));

/* ---------- Zona de pausa y reunión ---------- */
function plant(x,z,s){
  const g=new THREE.Group();g.position.set(x,0,z);g.scale.setScalar(s||1);scene.add(g);
  cyl(.3,.24,.45,M(0xf8fafc),0,.22,0,g);
  [[0,.85,0,.38],[.18,1.1,.08,.3],[-.15,1.05,-.1,.28]].forEach(p=>{const m=new THREE.Mesh(new THREE.IcosahedronGeometry(p[3],1),M(0x3f9b5b,{roughness:.8}));m.position.set(p[0],p[1],p[2]);m.castShadow=true;g.add(m);});
}
plant(-7.2,-4.5);plant(7.2,-4.6,1.1);plant(7.3,4.7,.9);plant(-7.2,-1.9,.8);
// sofá
box(2.6,.45,1.0,M(0x1f2937),-6.4,.25,4.5);
box(2.6,.7,.28,M(0x1f2937),-6.4,.65,4.95);
box(.3,.6,1.0,M(0x1f2937),-7.55,.45,4.5);box(.3,.6,1.0,M(0x1f2937),-5.25,.45,4.5);
box(.55,.12,.3,M(0xf26b21),-6.9,.55,4.45);
// café
box(2.0,.95,.6,M(0xf1f5f9),-7.35,.48,1.4);

const whiteM=M(0xf8fafc,{roughness:.35,metalness:.1}), darkM=M(0x334155,{roughness:.4,metalness:.5});
function makeRobot(a){
  const root=new THREE.Group();
  const up=new THREE.Group();root.add(up);
  const col=new THREE.Color(a.color);
  const visorM=new THREE.MeshStandardMaterial({color:0x0b1220,emissive:col,emissiveIntensity:.9,roughness:.2});
  const lightM=new THREE.MeshStandardMaterial({color:col,emissive:col,emissiveIntensity:1.2});
  box(.52,.62,.34,whiteM,0,.31,0,up);
  box(.3,.3,.02,M(0x0b1220),0,.38,.18,up);
  const chest=new THREE.Mesh(new THREE.BoxGeometry(.14,.14,.03),lightM);chest.position.set(0,.38,.2);up.add(chest);
  const head=new THREE.Mesh(new THREE.SphereGeometry(.27,24,18),whiteM);head.position.y=.92;head.castShadow=true;up.add(head);
  const visor=new THREE.Mesh(new THREE.BoxGeometry(.36,.14,.1),visorM);visor.position.set(0,.94,.2);up.add(visor);
  box(.06,.2,.06,darkM,0,1.2,0,up);
  const ant=new THREE.Mesh(new THREE.SphereGeometry(.05,10,10),lightM);ant.position.set(0,1.32,0);up.add(ant);
  const mkArm=sx=>{const p=new THREE.Group();p.position.set(sx*.35,.55,0);up.add(p);box(.14,.5,.14,whiteM,0,-.22,0,p);box(.12,.12,.12,darkM,0,-.5,0,p);return p;};
  const armL=mkArm(-1),armR=mkArm(1);
  const mkLeg=sx=>{const p=new THREE.Group();p.position.set(sx*.14,0,0);up.add(p);box(.17,.8,.17,darkM,0,-.4,0,p);box(.2,.1,.3,whiteM,0,-.82,.05,p);return p;};
  const legL=mkLeg(-1),legR=mkLeg(1);
  root.traverse(o=>{if(o.isMesh)o.userData.agent=a.id;});
  scene.add(root);
  return {root,up,armL,armR,legL,legR,head,chest,lightM,visorM};
}

function spark(a){
  const W=280,H=64,max=Math.max(...a.week,10),bw=28,gp=(W-bw*7)/6;
  const days=['L','M','X','J','V','S','D'];
  return '<svg viewBox="0 0 '+W+' '+(H+14)+'" role="img" aria-label="Tareas de los últimos 7 días">'+
    a.week.map((v,i)=>{const h=Math.max(3,v/max*H),x=i*(bw+gp),last=i===6;
      return '<rect x="'+x+'" y="'+(H-h)+'" width="'+bw+'" height="'+h+'" rx="5" fill="'+a.color+'" opacity="'+(last?1:.35)+'"/>'+
        '<text x="'+(x+bw/2)+'" y="'+(H+12)+'" text-anchor="middle" font-size="10" fill="#51607a" font-family="IBM Plex Mono, monospace">'+days[i]+'</text>';}).join('')+'</svg>';
}
function kpiFor(a){
  switch(a.kind){
    case 'jest':return [['Pruebas verdes',a.pass.toFixed(1)+'%'],['Cobertura',a.cov.toFixed(1)+'%']];
    case 'llm':return [['Tokens hoy',fmt(a.tokens)],['Costo hoy','$'+(a.tokens/1e6*3.2).toFixed(2)]];
    case 'rag':return [['Chunks',Math.round(a.chunks).toLocaleString('es-CO')],['Recall@5','0.91']];
    case 'mcp':return [['Servidores','4 activos'],['Llamadas',a.calls.toLocaleString('es-CO')]];
    case 'api':return [['Latencia p95',Math.round(a.p95)+' ms'],['Disponibilidad','99.97%']];
    default:return [['Filas',fmt(a.rows)],['Consultas',String(120+a.done*7)]];
  }
}

function select(id,fly){
  selected=id?AG.find(a=>a.id===id):null;
  AG.forEach(a=>{const s=selected===a;a.row.classList.toggle('sel',s);a.chip.classList.toggle('sel',s);a.lbl.classList.toggle('sel',s);});
  renderDetail();
  if(fly&&selected){const a=selected,p=new THREE.Vector3(a.pos.x,1.0,a.pos.y);flyTo(p.clone().add(new THREE.Vector3(3.6,2.0,4.6)),p);}
}
function flyScreen(a){
  const m=a.mon.position.clone();m.y=1.45;
  const d=new THREE.Vector3(Math.sin(a.mon.rotation.y),.06,Math.cos(a.mon.rotation.y));
  flyTo(m.clone().add(d.multiplyScalar(3.0)),m);
}
let tw=null;
function flyTo(p,t){
  if(REDUCE){camera.position.copy(p);controls.target.copy(t);return;}
  tw={p0:camera.position.clone(),t0:controls.target.clone(),p1:p.clone(),t1:t.clone(),k:0,dur:1.1};
}
controls.addEventListener('start',()=>{tw=null;controls.autoRotate=false;$('#b-rot').textContent='Girar cámara';});
$('#b-home').onclick=()=>{select(null);flyTo(HOME.p,HOME.t);};
$('#b-rot').onclick=e=>{controls.autoRotate=!controls.autoRotate;e.target.textContent=controls.autoRotate?'Detener giro':'Girar cámara';};

/* Selección con clic en la escena */
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();let down=null;
renderer.domElement.addEventListener('pointerdown',e=>{down=[e.clientX,e.clientY];});
renderer.domElement.addEventListener('pointerup',e=>{
  if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>5)return;
  const r=renderer.domElement.getBoundingClientRect();
  mouse.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(mouse,camera);
  const hits=ray.intersectObjects(scene.children,true).filter(h=>h.object.userData.agent);
  if(hits.length)select(hits[0].object.userData.agent,true);
});

/* ---------- Movimiento de los ingenieros ---------- */
const SPEED=1.9;
function newTask(a){
  let t;do{t=a.tasks[Math.floor(Math.random()*a.tasks.length)];}while(t===a.task);
  a.task=t;a.progress=0;a.rate=rnd(.035,.07);
  addEvent(a,'empezó: '+t);
}
function startLeave(a){
  a.mode='leaving';const b=a.bspot;
  a.path=[[a.gap.x,a.seat.z],[a.gap.x,.2],[b.x,.2],[b.x,b.z]];
}
function startReturn(a){
  a.mode='returning';const b=a.bspot;
  a.path=[[b.x,.2],[a.gap.x,.2],[a.gap.x,a.seat.z],[a.seat.x,a.seat.z]];
}
function lerpAngle(a,b,k){let d=((b-a+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI;return a+d*k;}
function stepAgent(a,dt,t){
  const R=a.r;let moving=false;
  if(a.mode==='work'){
    a.sit+=(1-a.sit)*Math.min(1,dt*5);
    a.face=lerpAngle(a.face,0,Math.min(1,dt*8));
    a.progress+=dt*a.rate;a.mins+=dt/60*8;
    if(a.progress>=1){
      a.done++;a.week[6]=a.done;addEvent(a,'terminó: '+a.task);
      if(a.kind==='jest'){a.pass=clamp(a.pass+rnd(-.4,.5),94,99.4);a.cov=clamp(a.cov+rnd(0,.3),80,95);}
      if(Math.random()<.5)startLeave(a);else newTask(a);
    }
    a.tokens+=dt*rnd(300,900)*(a.kind==='llm'?3:1);a.chunks+=dt*(a.kind==='rag'?18:0);a.calls+=dt*(a.kind==='mcp'?3:.4);a.rows+=dt*(a.kind==='sql'?900:0);
  }else if(a.mode==='leaving'||a.mode==='returning'){
    a.sit+=(0-a.sit)*Math.min(1,dt*6);
    if(a.sit<.18){
      if(a.path.length){
        const w=a.path[0],dx=w[0]-a.pos.x,dz=w[1]-a.pos.y,d=Math.hypot(dx,dz),st=SPEED*dt;
        a.face=lerpAngle(a.face,Math.atan2(dx,dz),Math.min(1,dt*10));moving=true;
        if(d<=st){a.pos.set(w[0],w[1]);a.path.shift();}else{a.pos.x+=dx/d*st;a.pos.y+=dz/d*st;}
      }
      if(!a.path.length){
        if(a.mode==='leaving'){a.mode='break';a.timer=rnd(6,12);}
        else{a.mode='work';newTask(a);}
      }
    }
  }else{ // break
    a.sit+=(0-a.sit)*Math.min(1,dt*6);
    a.face=lerpAngle(a.face,a.bspot.x<0?Math.PI*.35:-Math.PI*.35,Math.min(1,dt*3));
    a.timer-=dt;if(a.timer<=0)startReturn(a);
  }
  // pose
  a.walk+=moving?dt*SPEED*4.2:0;
  const sw=moving?Math.sin(a.walk)*.7:0, s=a.sit;
  R.root.position.set(a.pos.x,0,a.pos.y);R.root.rotation.y=a.face;
  R.up.position.y=.88-.33*s+(moving?Math.abs(Math.sin(a.walk))*.04:0);
  R.legL.rotation.x=-Math.PI/2*s+sw*(1-s);R.legR.rotation.x=-Math.PI/2*s-sw*(1-s);
  const typing=a.mode==='work'&&s>.8;
  const ty=typing?Math.sin(t*14+a.i)*.08:0;
  R.armL.rotation.x=-1.15*s-sw*(1-s)+ty;R.armR.rotation.x=-1.15*s+sw*(1-s)-ty;
  if(a.mode==='break'){R.armR.rotation.x=-.7+Math.sin(t*2+a.i)*.25;} // gesticula
  R.head.rotation.y=typing?Math.sin(t*.7+a.i)*.12:Math.sin(t*1.1+a.i)*.25;
  const pulse=a.mode==='work'?1.1+.7*Math.sin(t*5+a.i):.25;
  R.lightM.emissiveIntensity=pulse;R.visorM.emissiveIntensity=a.mode==='work'?1:.35;
}

/* ---------- Bucle ---------- */
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;
  const narrow=w<860;HOME.p.set(narrow?15:11,narrow?12.5:9.6,narrow?18:13.5);camera.fov=narrow?42:34;camera.updateProjectionMatrix();}
window.addEventListener('resize',resize);resize();
camera.position.copy(HOME.p);

const clock=new THREE.Clock();let acc=0,accUi=0,clockAcc=0,T=0;const v3=new THREE.Vector3();
function tickData(){
  AG.forEach(a=>{
    a.hist.push(clamp(a.hist[a.hist.length-1]+rnd(-9,9)+(a.mode==='work'?1:-1),12,95));a.hist.shift();
    if(a.kind==='api')a.p95=30+a.hist[a.hist.length-1]*.9;
    if(a.kind==='sql'&&a.mode==='work'){const q=SQLQ[a.sqlI%SQLQ.length];a.sqlPos+=3;if(a.sqlPos>q.length+14){a.sqlPos=0;a.sqlI++;}}
  });
}
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),.05);T+=dt;
  if(tw){tw.k+=dt/tw.dur;const k=Math.min(tw.k,1),e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
    camera.position.lerpVectors(tw.p0,tw.p1,e);controls.target.lerpVectors(tw.t0,tw.t1,e);if(k>=1)tw=null;}
  controls.update();
  AG.forEach(a=>stepAgent(a,dt,T));
  holo.forEach((b,i)=>{const h=.3+(.5+.5*Math.sin(T*1.6+i*.9))*1.1;b.scale.y=h;b.position.y=.8+h/2;});
  acc+=dt;if(acc>.4){acc=0;tickData();AG.forEach(a=>drawMon(a,T));}
  drawWallMaybe(dt);
  // etiquetas
  const w=stage.clientWidth,h=stage.clientHeight;
  AG.forEach(a=>{
    v3.set(a.pos.x,1.75-.3*a.sit+.0,a.pos.y).project(camera);
    const vis=v3.z<1;a.lbl.style.opacity=vis?1:0;
    a.lbl.style.transform='translate('+((v3.x*.5+.5)*w)+'px,'+((-v3.y*.5+.5)*h-30)+'px) translate(-50%,-100%)';
  });
  accUi+=dt;if(accUi>.5){accUi=0;updateUi();}
  renderer.render(scene,camera);
}
let wallAcc=1;
function drawWallMaybe(dt){wallAcc+=dt;if(wallAcc>.4){wallAcc=0;drawWall(T);}}
function updateUi(){
  AG.forEach(a=>{
    const st=a.row.querySelector('.st');const txt=stLabel(a);if(st.textContent!==txt){st.textContent=txt;st.classList.toggle('pause',a.mode!=='work');}
    a.row.querySelector('.bar i').style.width=(a.mode==='work'?a.progress*100:0)+'%';
    a.lbl.firstChild.style.opacity=a.mode==='work'?1:.4;
  });
  const total=AG.reduce((s,a)=>s+a.done,0),act=AG.filter(a=>a.mode==='work').length,tok=AG.reduce((s,a)=>s+a.tokens,0);
  $('#s-tasks').textContent=total;$('#s-active').textContent=act+'/6';$('#s-tests').textContent=AG[0].pass.toFixed(1)+'%';$('#s-tokens').textContent=fmt(tok);
  $('#clock').textContent=hhmm();
  refreshDetail();
}
AG.forEach(a=>drawMon(a,0));drawWall(0);
renderDetail();updateUi();
loop();
})();
</script>
